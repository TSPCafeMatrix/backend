# Perfil demo (Sprints 2-3): H2 en memoria, sin MySQL. Los datos se pierden al reiniciar.
# Para Sprint 4 se reemplaza por el perfil prod (MySQL).
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# H2 Datasource Configuration
spring.datasource.url=jdbc:h2:mem:cafe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Data JPA Configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true

documentation.server.url=${DOCUMENTATION_SERVER_URL:}
